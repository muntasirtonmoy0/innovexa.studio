<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Innovexa Studio | Project & Community Gallery</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .gallery-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .gallery-card:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-4px);
    }

    .gallery-image {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      background: #0d0f18;
    }

    .gallery-info {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
  </style>
</head>
<body>
  <div id="preloader"><div class="loader-content"><div class="loader-ring"></div></div></div>
  <div id="cursor-glow"></div>
  <canvas id="bg-canvas"></canvas>
  <div class="ambient-glow"></div>

  <!-- Centralized Dynamic Navigation -->
  <div id="navbar-placeholder"></div>

  <main>
    <section class="hero reveal" style="min-height: 26vh; padding-top: 2rem;">
      <div class="badge">Showcase & Proofs</div>
      <h1>Project <span class="gradient-text">Gallery & Builds</span></h1>
      <p>Browse live implementations, Discord bot dashboards, and community creations.</p>
      <div style="margin-top: 1rem;">
        <button id="toggle-upload-btn" class="btn btn-primary">➕ Upload Showcase Item</button>
      </div>
    </section>

    <!-- Upload Modal / Section -->
    <section id="upload-section" class="container reveal" style="display:none; padding-top:0;">
      <div class="form-box">
        <h3 style="font-size:1.25rem; margin-bottom:0.4rem;">Submit to Gallery</h3>
        <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:1.25rem;">Share your bot in action or custom site screenshot.</p>

        <form id="gallery-form">
          <div class="form-group">
            <label for="item-title">Title / Project Name</label>
            <input type="text" id="item-title" class="form-input" placeholder="e.g. Eternal SMP Discord Bot" required>
          </div>

          <div class="form-group">
            <label for="item-desc">Short Description</label>
            <textarea id="item-desc" class="form-input" placeholder="Describe the features or tech stack used..." required></textarea>
          </div>

          <div class="form-group">
            <label for="item-category">Category</label>
            <select id="item-category" class="form-input">
              <option value="Discord Bot">Discord Bot</option>
              <option value="Website">Website</option>
              <option value="Community Dashboard">Community Dashboard</option>
            </select>
          </div>

          <div class="form-group">
            <label for="item-file">Upload Screenshot (Max 5MB)</label>
            <input type="file" id="item-file" class="form-input" accept="image/*" required>
            <div id="upload-status" style="font-size:0.8rem; color:var(--accent-cyan); margin-top:4px; display:none;">Uploading image to cloud...</div>
          </div>

          <button type="submit" id="submit-item-btn" class="btn btn-primary" style="width:100%;">Publish to Gallery</button>
        </form>
      </div>
    </section>

    <!-- Gallery Grid -->
    <section class="container reveal">
      <div id="gallery-loading" style="text-align:center; color:var(--text-muted);">Loading gallery items...</div>
      <div class="gallery-grid" id="gallery-container"></div>
    </section>
  </main>

  <footer><p>&copy; 2026 Innovexa Studio. All rights reserved.</p></footer>

  <script src="app.js"></script>
  <script src="navbar.js"></script>
  <script type="module" src="cart.js"></script>
  <script type="module" src="auth-modal.js"></script>
  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
    import { openAuthModal } from "./auth-modal.js";
    import { uploadImageToCloud } from "./image-uploader.js";

    const uploadBtn = document.getElementById("toggle-upload-btn");
    const uploadSection = document.getElementById("upload-section");
    const galleryForm = document.getElementById("gallery-form");
    const galleryContainer = document.getElementById("gallery-container");
    const galleryLoading = document.getElementById("gallery-loading");
    const uploadStatus = document.getElementById("upload-status");

    uploadBtn.onclick = () => {
      if (!auth.currentUser) {
        openAuthModal(false);
        return;
      }
      uploadSection.style.display = uploadSection.style.display === "none" ? "block" : "none";
      if (uploadSection.style.display === "block") {
        uploadSection.scrollIntoView({ behavior: "smooth" });
      }
    };

    galleryForm.onsubmit = async (e) => {
      e.preventDefault();
      const user = auth.currentUser;
      if (!user) {
        openAuthModal(false);
        return;
      }

      const title = document.getElementById("item-title").value.trim();
      const desc = document.getElementById("item-desc").value.trim();
      const category = document.getElementById("item-category").value;
      const fileInput = document.getElementById("item-file");
      const submitBtn = document.getElementById("submit-item-btn");

      if (!fileInput.files[0]) return;

      submitBtn.disabled = true;
      submitBtn.innerText = "Publishing...";
      uploadStatus.style.display = "block";

      try {
        const imageUrl = await uploadImageToCloud(fileInput.files[0]);
        await addDoc(collection(db, "gallery"), {
          title,
          desc,
          category,
          imageUrl,
          authorName: user.displayName || user.email.split('@')[0],
          userId: user.uid,
          createdAt: serverTimestamp()
        });

        galleryForm.reset();
        uploadSection.style.display = "none";
        uploadStatus.style.display = "none";
        alert("Showcase uploaded successfully!");
      } catch (err) {
        alert("Error publishing item: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Publish to Gallery";
        uploadStatus.style.display = "none";
      }
    };

    const q = query(collection(db, "gallery"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snap) => {
      galleryLoading.style.display = "none";
      galleryContainer.innerHTML = snap.empty ? `<p style="grid-column:1/-1; text-align:center; color:var(--text-muted);">No items in the gallery yet.</p>` : "";

      snap.forEach(doc => {
        const d = doc.data();
        const date = d.createdAt ? new Date(d.createdAt.toDate()).toLocaleDateString() : "Recent";
        galleryContainer.insertAdjacentHTML("beforeend", `
          <div class="gallery-card">
            <a href="${d.imageUrl}" target="_blank">
              <img src="${d.imageUrl}" alt="${d.title}" class="gallery-image" loading="lazy" />
            </a>
            <div class="gallery-info">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <span class="badge" style="margin:0; font-size:0.68rem; padding:0.18rem 0.55rem;">${d.category || "Showcase"}</span>
                <span style="font-size:0.75rem; color:var(--text-muted);">${date}</span>
              </div>
              <h3 style="font-size:1.1rem; color:#fff; margin-bottom:0.4rem;">${d.title}</h3>
              <p style="font-size:0.86rem; color:var(--text-muted); line-height:1.45; margin-bottom:0.75rem;">${d.desc}</p>
              <div style="margin-top:auto; font-size:0.75rem; color:var(--text-muted);">Uploaded by <strong style="color:#fff;">${d.authorName}</strong></div>
            </div>
          </div>
        `);
      });
    });
  </script>
</body>
</html>
